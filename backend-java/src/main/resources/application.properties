# Women Safety Portal - Spring Boot Configuration
server.port=${PORT:5000}

# Application Properties
app.cors.allowed-origin=${CLIENT_ORIGIN:http://localhost:5173}
app.turso.url=${TURSO_DATABASE_URL:}
app.turso.token=${TURSO_AUTH_TOKEN:${TURSO_DATABASE_TOKEN:}}
app.jwt.secret=${JWT_SECRET:super_secret_jwt_key_change_in_production_389274928374}
app.jwt.expiration-ms=604800000
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.upload.dir=${UPLOAD_DIR:uploads}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.womensafety=INFO
logging.level.org.springframework.web=INFO

# Mail Configuration (Optional - for live password reset delivery)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@womensafetyportal.com}

